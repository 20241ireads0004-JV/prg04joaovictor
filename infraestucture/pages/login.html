<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO ESPORTE - Login</title>

    <!-- FAVICON DO PROJETO -->
    <link rel="shortcut icon" href="../assets/images/favicon.ico" type="image/x-icon">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS DO PROJETO -->
    <link rel="stylesheet" href="../assets/css/styles.css">

    <!-- JAVASCRIPT DO PROJETO -->
    <script src="../assets/js/script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">TODO ESPORTE</span>
            <a href="index.html" class="btn btn-outline-light">← Voltar</a>
        </div>
    </nav>

    <!-- MAIN LOGIN -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="w-100">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="card border-0 shadow-lg">
                        <div class="card-body p-5">
                            <h2 class="text-center text-primary fw-bold mb-4">Faça seu Login</h2>
                            
                            <form id="loginForm">
                                <!-- EMAIL -->
                                <div class="mb-4">
                                    <input 
                                        type="email" 
                                        id="email" 
                                        class="form-control form-control-lg"
                                        required 
                                        placeholder="Digite seu email aqui"
                                        title="Digite um e-mail válido">
                                </div>

                                <!-- SENHA -->
                                <div class="mb-4">
                                    <input 
                                        type="password" 
                                        id="senha" 
                                        class="form-control form-control-lg"
                                        required 
                                        minlength="4"
                                        placeholder="Digite sua senha aqui">
                                </div>

                                <!-- BOTÃO -->
                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Entrar</button>

                                <!-- MENSAGEM DE ERRO -->
                                <p id="erro" class="erro text-center mt-3 mb-0"></p>
                            </form>

                            <!-- LINK PARA HOME -->
                            <div class="text-center mt-4">
                                <p class="text-muted mb-2">Não tem conta?</p>
                                <a href="index.html" class="btn btn-outline-secondary btn-sm">Ir para Home</a>
                            </div>
                        </div>
                    </div>

                    <!-- INFORMAÇÃO EXTRA -->
                    <div class="alert alert-info mt-4 text-center" role="alert">
                        <small>Use qualquer email e senha com mínimo 4 caracteres para testar</small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 - TODO ESPORTE. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
